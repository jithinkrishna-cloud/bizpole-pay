<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bizpole Pay">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#F3F1EC"/>
      <stop offset="1" stop-color="#D9D5CC"/>
    </linearGradient>
    <linearGradient id="curl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9C4BA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59A90"/>
      <stop offset="1" stop-color="#E05449"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE68A"/>
      <stop offset=".55" stop-color="#F6C537"/>
      <stop offset="1" stop-color="#E9A41C"/>
    </linearGradient>
    <radialGradient id="coin" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFD48A"/>
      <stop offset=".5" stop-color="#F5A63A"/>
      <stop offset="1" stop-color="#D9801C"/>
    </radialGradient>
    <radialGradient id="ground" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#211F24" stop-opacity=".28"/>
      <stop offset="1" stop-color="#211F24" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx=".6" dy="1.6" stdDeviation="1.4" flood-color="#211F24" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="33" cy="60.5" rx="22" ry="2.6" fill="url(#ground)"/>

  <!-- receipt, tilted, with a curl at the bottom -->
  <g transform="rotate(-9 31 32)" filter="url(#soft)">
    <path d="M18 8.5C26 7 34.5 7 42 8.5L43.5 49c.2 4.5 2.2 7.6 5.5 9H23c-3 0-4.6-2.4-4.7-5.4z" fill="url(#sheet)"/>
    <path d="M43.5 49c.2 4.5 2.2 7.6 5.5 9-3.6.6-7.4-1.4-8.6-5.6z" fill="url(#curl)"/>
    <g fill="url(#bar)">
      <rect x="24" y="14" width="13" height="3" rx="1.5"/>
      <rect x="22.5" y="20" width="15.5" height="3" rx="1.5"/>
      <rect x="23.5" y="26" width="14.5" height="3" rx="1.5"/>
      <rect x="27" y="32" width="11" height="3" rx="1.5"/>
      <rect x="24" y="38" width="14.5" height="3" rx="1.5"/>
      <rect x="25" y="44" width="14" height="3" rx="1.5"/>
    </g>
    <g fill="#fff" fill-opacity=".55">
      <rect x="25" y="14.5" width="9" height=".9" rx=".45"/>
      <rect x="23.5" y="20.5" width="11" height=".9" rx=".45"/>
      <rect x="24.5" y="26.5" width="10" height=".9" rx=".45"/>
      <rect x="28" y="32.5" width="7" height=".9" rx=".45"/>
      <rect x="25" y="38.5" width="10" height=".9" rx=".45"/>
      <rect x="26" y="44.5" width="9.5" height=".9" rx=".45"/>
    </g>
  </g>

  <!-- lightning bolt: dark extrusion, glossy face, highlight -->
  <path d="M50.2 4.2 42 16.4h6.2L45 25.6l11.4-13.4h-6.3l4-8z" fill="#C9850F"/>
  <path d="M49 3 41 15h6.2L44 24.4 55.2 11h-6.3l4-8z" fill="url(#bolt)"/>
  <path d="M48.6 4.6 43.4 12.6" stroke="#fff" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round"/>

  <!-- left coin -->
  <g transform="rotate(-22 12.5 40)">
    <ellipse cx="13.6" cy="41.4" rx="7" ry="6.2" fill="#B8681A"/>
    <ellipse cx="12.5" cy="40" rx="7" ry="6.2" fill="url(#coin)"/>
    <ellipse cx="12.5" cy="40" rx="4.8" ry="4.2" fill="none" stroke="#C86F16" stroke-opacity=".6" stroke-width="1"/>
    <path d="M8 37.6a5.6 5 0 0 1 3.8-3" stroke="#fff" stroke-opacity=".7" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- right coin -->
  <g transform="rotate(24 51 49)">
    <ellipse cx="52.2" cy="50.4" rx="7.4" ry="6.4" fill="#B8681A"/>
    <ellipse cx="51" cy="49" rx="7.4" ry="6.4" fill="url(#coin)"/>
    <ellipse cx="51" cy="49" rx="5.1" ry="4.4" fill="none" stroke="#C86F16" stroke-opacity=".6" stroke-width="1"/>
    <path d="M46.2 46.4a6 5.2 0 0 1 4-3.1" stroke="#fff" stroke-opacity=".7" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- sparkles -->
  <g fill="#F2B42C">
    <path d="M9 22.5Q9 26 12.5 26 9 26 9 29.5 9 26 5.5 26 9 26 9 22.5z"/>
    <path d="M52 30Q52 32.2 54.2 32.2 52 32.2 52 34.4 52 32.2 49.8 32.2 52 32.2 52 30z"/>
    <path d="M13 50.5Q13 53 15.5 53 13 53 13 55.5 13 53 10.5 53 13 53 13 50.5z"/>
  </g>
</svg>
